name: antigone

# Schede dell'Osservatorio di Antigone: ogni tre mesi (1 gennaio, aprile, luglio, ottobre) e a mano.
# Il grezzo (pagine e fogli) non va nel repository: antigone.it non dichiara una licenza di riuso.
# Resta nella cache di GitHub Actions (non scaricabile dal pubblico), così i fogli già letti non si
# riscaricano. Nel repository vanno solo i campi fattuali estratti (data/antigone/).
on:
  schedule:
    - cron: "23 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      aggiorna:
        description: "riscarica anche i fogli già presenti nella cache (si/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: antigone
  cancel-in-progress: false

jobs:
  antigone:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Grezzo dalla cache
        uses: actions/cache@v4
        with:
          path: data/raw-locale/antigone
          key: antigone-grezzo-${{ github.run_id }}
          restore-keys: antigone-grezzo-

      - name: Schede e fogli
        working-directory: scripts
        run: python fetch_antigone.py ${{ inputs.aggiorna == 'si' && '--aggiorna' || '' }}

      - name: Abbinamento con il Ministero
        working-directory: scripts
        run: python abbina_antigone.py

      - name: Commit solo se qualcosa è cambiato
        run: |
          git config user.name  "raccolta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data/antigone
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "dati: schede Antigone del $(date -u +%Y-%m-%d)"
            git push
          fi
