name: storico

# Serie storica dal Ministero (presenti dal 1991, capienze dal 2019, tabelle per istituto): solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storico
  cancel-in-progress: false

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Serie storica
        working-directory: scripts
        run: python fetch_storico.py

      - name: Serie oltre le capienze (data/serie)
        working-directory: scripts
        run: python fetch_serie.py

      - name: Commit solo se qualcosa è cambiato
        run: |
          git config user.name  "raccolta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data/storico data/raw/storico data/serie data/raw/serie
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "dati: serie storica del $(date -u +%Y-%m-%d)"
            git push
          fi
