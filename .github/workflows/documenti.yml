name: documenti

# Documenti ufficiali nuovi dagli elenchi di archive/elenchi_ufficiali.yml (scripts/documenti_ufficiali.py):
# i pertinenti si conservano interi in archive/files/, con testo, snapshot Wayback e riga in data/rassegna/.
# Ogni giorno alle 07:23 UTC, dopo la sorveglianza del repository privato (06:41), che chiede lo stesso
# snapshot: qui si riusa quello recente se c'è già. E a mano.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raccolta          # stesso gruppo di raccolta.yml: mai due commit su main nello stesso momento
  cancel-in-progress: false

jobs:
  documenti:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Documenti nuovi
        working-directory: scripts
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python documenti_ufficiali.py

      - name: Commit solo se qualcosa è cambiato
        if: always()
        run: |
          git config user.name  "raccolta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add archive data/rassegna
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "documenti: controllo del $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
