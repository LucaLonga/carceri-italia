name: raccolta

# Schede trasparenza: ogni lunedì (i numeri cambiano ogni giorno; una lettura a settimana basta
# per la serie e non pesa sul sito del Ministero).
# Tabella mensile del Ministero + archivio delle fonti: il 12 di ogni mese (il Ministero pubblica
# di solito entro la prima decade del mese successivo [VERIFICARE]).
on:
  schedule:
    - cron: "17 5 * * 1"     # lunedì 05:17 UTC
    - cron: "37 5 12 * *"    # giorno 12, 05:37 UTC
  workflow_dispatch:
    inputs:
      cosa:
        description: "tutto | schede | ministero | archivio | wayback-schede"
        default: "tutto"

permissions:
  contents: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Se i server di GitHub non raggiungono giustizia.it il run si ferma qui, con un messaggio chiaro:
      # in quel caso la raccolta si fa sul Mac (scripts/raccolta_locale.sh, vedi README).
      - name: giustizia.it raggiungibile?
        run: |
          codice=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 \
            -A "carceri-italia/0.1 (+https://lucalonga.com)" \
            "https://www.giustizia.it/giustizia/page/it/istituti_penitenziari" || echo "000")
          echo "risposta di giustizia.it: $codice"
          if [ "$codice" != "200" ]; then
            echo "::error::giustizia.it non raggiungibile da GitHub Actions (codice $codice): usare la raccolta sul Mac"
            exit 1
          fi

      - name: Schede trasparenza
        if: github.event.schedule == '17 5 * * 1' || inputs.cosa == 'tutto' || inputs.cosa == 'schede'
        working-directory: scripts
        run: python fetch_schede.py && python estrai_attivita.py

      - name: Tabelle mensili del Ministero
        if: github.event.schedule == '37 5 12 * *' || inputs.cosa == 'tutto' || inputs.cosa == 'ministero'
        working-directory: scripts
        run: python fetch_ministero.py

      - name: Archivio delle fonti (copia, testo, Wayback)
        if: github.event.schedule == '37 5 12 * *' || inputs.cosa == 'tutto' || inputs.cosa == 'archivio'
        working-directory: scripts
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python archive_sources.py
        continue-on-error: true   # la Wayback Machine a volte rifiuta: non deve bloccare i dati

      - name: Controlli
        working-directory: scripts
        run: python checks.py

      - name: Riepilogo nel run
        if: always()
        run: |
          echo "## Raccolta del $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          git status --short data archive | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          [ -f data/checks/ultimo.md ] && cat data/checks/ultimo.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit solo se qualcosa è cambiato
        if: always()
        run: |
          git config user.name  "raccolta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "dati: raccolta del $(date -u +%Y-%m-%d)"
            git push
          fi

  # Wayback per le 190 schede trasparenza (indirizzo diretto ?s=<MII>): una volta al mese, dopo la raccolta.
  # Senza chiavi di archive.org ogni snapshot richiede circa un minuto e mezzo: per questo è un job a parte,
  # lungo, che non blocca i dati e non fallisce mai.
  wayback-schede:
    needs: raccolta
    if: always() && (github.event.schedule == '37 5 12 * *' || inputs.cosa == 'tutto' || inputs.cosa == 'wayback-schede')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot Wayback delle schede
        working-directory: scripts
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python archive_sources.py --schede --pausa 15
        continue-on-error: true

      - name: Commit dell'esito
        if: always()
        run: |
          git config user.name  "raccolta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add archive/wayback_schede.csv
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "archivio: Wayback delle schede del $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
