name: sito

# Build del sito (Observable Framework + data loader in Python): solo a mano.
# Il sito su questo ramo è un banco di lavoro per i dati e non si pubblica (piano 51, 28.11.2026):
# niente avvio automatico a ogni push o dopo le raccolte. Il build serve a controllare che i data
# loader girino; la pubblicazione su GitHub Pages parte solo con "pubblica: si" e con Pages attivato
# (Settings → Pages → Source: "GitHub Actions"), oggi spento.
on:
  workflow_dispatch:
    inputs:
      pubblica:
        description: "pubblica su GitHub Pages dopo il build (si/no)"
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      OBSERVABLE_TELEMETRY_DISABLE: "true"
      # Il nome utente non è scritto nel codice: lo dà GitHub.
      SITO_UTENTE: ${{ github.repository_owner }}
      SITO_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # dopo una raccolta: l'ultimo commit di main, con i dati nuovi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # i data loader usano solo la libreria standard

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        if: inputs.pubblica == 'si'
      - uses: actions/upload-pages-artifact@v3
        if: inputs.pubblica == 'si'
        with:
          path: site/dist

  deploy:
    needs: build
    if: inputs.pubblica == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
