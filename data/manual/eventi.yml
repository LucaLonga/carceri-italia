# Eventi rilevanti per la storia dell'affollamento, compilati a mano.
#
# Ogni voce:
#   data        AAAA-MM-GG (o AAAA-MM se il giorno non è certo)
#   titolo      breve, in italiano
#   tipo        sentenza | legge | decreto | piano | annuncio | altro
#   fonte       link alla fonte primaria (Normattiva, HUDOC, Gazzetta Ufficiale, Ministero)
#   etichetta   [verificata] solo se data, numero E contenuto sono stati letti sulla fonte;
#               altrimenti [VERIFICARE] con una nota su che cosa è stato controllato.
#   nota        che cosa è stato verificato e che cosa no
#
# Non si aggiunge nulla senza una fonte. Dove manca, resta il segnaposto.
# Il contenuto delle leggi (oggetto) è scritto a memoria e va riletto sulla fonte: per questo le voci
# hanno [VERIFICARE] anche quando numero e data sono confermati.

